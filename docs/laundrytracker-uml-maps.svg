  <text x="30" y="1129" font-size="11" fill="#555">Key:</text><text x="62" y="1129" font-size="11" fill="#555">+ public</text><text x="127" y="1129" font-size="11" fill="#555">- private</text><text x="198" y="1129" font-size="11" fill="#555"># protected</text><text x="280" y="1129" font-size="11" fill="#555">? can be null</text><text x="374" y="1129" font-size="11" fill="#555">italic = abstract</text><text x="490" y="1129" font-size="11" fill="#555">hollow triangle = extends / implements</text><text x="726" y="1129" font-size="11" fill="#555">dashed arrow = uses / opens</text><text x="899" y="1129" font-size="11" fill="#555">grey = library class</text>
