<text x="20" y="1192" font-size="10.5" fill="#444" xml:space="preserve">Key:   + public     - private     # protected     ? can be null     italic = abstract     solid line + hollow triangle = extends     dashed line + hollow triangle = implements     filled diamond = owns     hollow diamond = holds 0..*     dashed arrow = uses / opens / creates</text>
