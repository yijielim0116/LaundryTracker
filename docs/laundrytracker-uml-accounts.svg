<svg viewBox="0 0 1440 1178" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1440" height="1178" fill="#ffffff"/>
  <defs>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
    <marker id="hollowTriangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 7 L 0 14 Z" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
    </marker>
  </defs>
  <text x="720.0" y="34" font-size="17" font-weight="bold" text-anchor="middle">Laundry Tracker: accounts and settings (Firebase Auth, session, dark mode)</text>
<rect x="200" y="60" width="380" height="89" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="104" x2="580" y2="104" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="116" x2="580" y2="116" stroke="#333" stroke-width="1.5"/>
  <text x="390.0" y="77" font-size="12" font-style="italic" text-anchor="middle">« Android »</text>
  <text x="390.0" y="95" font-size="15" font-weight="bold" text-anchor="middle">AppCompatActivity</text>
  <text x="210" y="136" font-size="11" fill="#555">(from the AndroidX AppCompat library)</text>
  <rect x="1030" y="60" width="290" height="89" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <line x1="1030" y1="104" x2="1320" y2="104" stroke="#333" stroke-width="1.5"/>
  <line x1="1030" y1="116" x2="1320" y2="116" stroke="#333" stroke-width="1.5"/>
  <text x="1175.0" y="77" font-size="12" font-style="italic" text-anchor="middle">« Android »</text>
  <text x="1175.0" y="95" font-size="15" font-weight="bold" text-anchor="middle">Application</text>
  <text x="1040" y="136" font-size="11" fill="#555">(from the Android framework)</text>
  <rect x="30" y="215" width="320" height="198" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="245" x2="350" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="312" x2="350" y2="312" stroke="#333" stroke-width="1.5"/>
  <text x="190.0" y="235" font-size="15" font-weight="bold" text-anchor="middle">LoginActivity</text>
  <text x="40" y="265" font-size="12">- emailInput: EditText</text>
  <text x="40" y="282" font-size="12">- passwordInput: EditText</text>
  <text x="40" y="299" font-size="12">- loginButton: Button</text>
  <text x="40" y="332" font-size="12">+ onCreate(savedInstanceState: Bundle?)</text>
  <text x="40" y="349" font-size="12">- logIn()</text>
  <text x="40" y="366" font-size="12">- showLoginError(error: Exception?)</text>
  <text x="40" y="383" font-size="12">- openHome()</text>
  <text x="40" y="400" font-size="11" fill="#555">« after the splash if not logged in »</text>
  <rect x="420" y="215" width="380" height="215" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="245" x2="800" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="346" x2="800" y2="346" stroke="#333" stroke-width="1.5"/>
  <text x="610.0" y="235" font-size="15" font-weight="bold" text-anchor="middle">SignupActivity</text>
  <text x="430" y="265" font-size="12">- emailInput: EditText</text>
  <text x="430" y="282" font-size="12">- passwordInput: EditText</text>
  <text x="430" y="299" font-size="12">- confirmInput: EditText</text>
  <text x="430" y="316" font-size="12">- signupButton: Button</text>
  <text x="430" y="333" font-size="12">- MIN_PASSWORD_LENGTH: Int = 6</text>
  <text x="430" y="366" font-size="12">+ onCreate(savedInstanceState: Bundle?)</text>
  <text x="430" y="383" font-size="12">- signUp()</text>
  <text x="430" y="400" font-size="12">- showSignupError(error: Exception?)</text>
  <text x="430" y="417" font-size="12">- openHome()</text>
  <rect x="1050" y="215" width="300" height="109" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="1050" y1="245" x2="1350" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="1050" y1="257" x2="1350" y2="257" stroke="#333" stroke-width="1.5"/>
  <text x="1200.0" y="235" font-size="15" font-weight="bold" text-anchor="middle">MainApp</text>
  <text x="1060" y="277" font-size="12">+ onCreate()</text>
  <text x="1060" y="294" font-size="11" fill="#555">« plants Timber, applies ThemeSetting, »</text>
  <text x="1060" y="311" font-size="11" fill="#555">« calls AppData.initialize() »</text>
  <rect x="30" y="545" width="380" height="157" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="589" x2="410" y2="589" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="601" x2="410" y2="601" stroke="#333" stroke-width="1.5"/>
  <text x="220.0" y="562" font-size="12" font-style="italic" text-anchor="middle">« object »</text>
  <text x="220.0" y="580" font-size="15" font-weight="bold" text-anchor="middle">Session</text>
  <text x="40" y="621" font-size="12">+ userId(): String?</text>
  <text x="40" y="638" font-size="12">+ currentEmail(): String?</text>
  <text x="40" y="655" font-size="12">+ isLoggedIn(): Boolean</text>
  <text x="40" y="672" font-size="12">+ logout()</text>
  <text x="40" y="689" font-size="11" fill="#555">« just asks Firebase who is logged in »</text>
  <rect x="520" y="545" width="360" height="161" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="520" y1="589" x2="880" y2="589" stroke="#333" stroke-width="1.5"/>
  <line x1="520" y1="622" x2="880" y2="622" stroke="#333" stroke-width="1.5"/>
  <text x="700.0" y="562" font-size="12" font-style="italic" text-anchor="middle">« object »</text>
  <text x="700.0" y="580" font-size="15" font-weight="bold" text-anchor="middle">AppData</text>
  <text x="530" y="609" font-size="12">+ machines: MachineStore  (lateinit, private set)</text>
  <text x="530" y="642" font-size="12">+ initialize()</text>
  <text x="530" y="659" font-size="12">+ useCloudStoreFor(userId: String)</text>
  <text x="530" y="676" font-size="12">+ signedOut()</text>
  <text x="530" y="693" font-size="11" fill="#555">« full box in the main diagram »</text>
  <rect x="990" y="545" width="420" height="174" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <line x1="990" y1="589" x2="1410" y2="589" stroke="#333" stroke-width="1.5"/>
  <line x1="990" y1="601" x2="1410" y2="601" stroke="#333" stroke-width="1.5"/>
  <text x="1200.0" y="562" font-size="12" font-style="italic" text-anchor="middle">« Firebase »</text>
  <text x="1200.0" y="580" font-size="15" font-weight="bold" text-anchor="middle">FirebaseAuth</text>
  <text x="1000" y="621" font-size="12">+ getInstance(): FirebaseAuth</text>
  <text x="1000" y="638" font-size="12">+ createUserWithEmailAndPassword(email, password)</text>
  <text x="1000" y="655" font-size="12">+ signInWithEmailAndPassword(email, password)</text>
  <text x="1000" y="672" font-size="12">+ currentUser: FirebaseUser?</text>
  <text x="1000" y="689" font-size="12">+ signOut()</text>
  <text x="1000" y="706" font-size="11" fill="#555">« keeps passwords safe and remembers who is logged in »</text>
  <text x="30" y="839" font-size="14" font-weight="bold" fill="#333">Settings</text>
  <line x1="30" y1="847" x2="1410" y2="847" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="30" y="869" width="460" height="229" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="913" x2="490" y2="913" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="980" x2="490" y2="980" stroke="#333" stroke-width="1.5"/>
  <text x="260.0" y="886" font-size="12" font-style="italic" text-anchor="middle">« object »</text>
  <text x="260.0" y="904" font-size="15" font-weight="bold" text-anchor="middle">ThemeSetting</text>
  <text x="40" y="933" font-size="12">+ SYSTEM = 0, LIGHT = 1, DARK = 2</text>
  <text x="40" y="950" font-size="12">- PREFS_NAME: String = "settings"</text>
  <text x="40" y="967" font-size="12">- KEY_THEME: String = "theme"</text>
  <text x="40" y="1000" font-size="12">+ saved(context: Context): Int</text>
  <text x="40" y="1017" font-size="12">+ save(context: Context, choice: Int)</text>
  <text x="40" y="1034" font-size="12">+ toNightMode(choice: Int): Int</text>
  <text x="40" y="1051" font-size="12">+ apply(choice: Int)</text>
  <text x="40" y="1068" font-size="12">+ applySaved(context: Context)</text>
  <text x="40" y="1085" font-size="11" fill="#555">« saved in SharedPreferences »</text>
  <rect x="620" y="869" width="420" height="140" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="913" x2="1040" y2="913" stroke="#333" stroke-width="1.5"/>
  <line x1="620" y1="925" x2="1040" y2="925" stroke="#333" stroke-width="1.5"/>
  <text x="830.0" y="886" font-size="12" font-style="italic" text-anchor="middle">« abstract »</text>
  <text x="830.0" y="904" font-size="15" font-weight="bold" font-style="italic" text-anchor="middle">DrawerActivity</text>
  <text x="630" y="945" font-size="12">- showDarkModeChoice()</text>
  <text x="630" y="962" font-size="12">- logOut()</text>
  <text x="630" y="979" font-size="11" fill="#555">« logOut(): Session.logout() + AppData.signedOut() »</text>
  <text x="630" y="996" font-size="11" fill="#555">« full box in the main diagram »</text>
