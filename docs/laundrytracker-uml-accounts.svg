  <path d="M 350 265 L 420 265" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="385.0" y="258" font-size="11" fill="#555" text-anchor="middle">« opens »</text>
  <path d="M 190.0 413 L 190.0 475" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 610.0 430 L 610.0 475" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 190.0 475 L 1200.0 475" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 220.0 475 L 220.0 545" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <path d="M 700.0 475 L 700.0 545" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <path d="M 1200.0 475 L 1200.0 545" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="708.0" y="467" font-size="11" fill="#555" text-anchor="start">« uses »</text>
  <text x="1208.0" y="537" font-size="11" fill="#555" text-anchor="start">sign in / create user</text>
  <path d="M 220.0 702 L 220.0 759 L 1280.0 759 L 1280.0 719" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="228.0" y="753" font-size="11" fill="#555" text-anchor="start">« currentUser, signOut() »</text>
  <path d="M 1050 275 L 840 275 L 840 545" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="1042" y="269" font-size="11" fill="#555" text-anchor="end">« initialize() »</text>
  <path d="M 1350 255 L 1426 255 L 1426 1128 L 260.0 1128 L 260.0 1098" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="1418" y="1120" font-size="11" fill="#555" text-anchor="end">« applySaved() »</text>
  <path d="M 620 919 L 490 919" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="555.0" y="912" font-size="11" fill="#555" text-anchor="middle">« save(), apply() »</text>
  <path d="M 830.0 869 L 830.0 706" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="838.0" y="839" font-size="11" fill="#555" text-anchor="start">« signedOut() »</text>
  <text x="30" y="1150" font-size="11" fill="#555">Key:</text><text x="62" y="1150" font-size="11" fill="#555">+ public</text><text x="127" y="1150" font-size="11" fill="#555">- private</text><text x="198" y="1150" font-size="11" fill="#555">? can be null</text><text x="292" y="1150" font-size="11" fill="#555">italic = abstract</text><text x="408" y="1150" font-size="11" fill="#555">grey = library class</text><text x="542" y="1150" font-size="11" fill="#555">hollow triangle = extends</text><text x="704" y="1150" font-size="11" fill="#555">dashed arrow = uses / opens / calls</text>
</svg>
