<svg viewBox="0 0 1440 1365" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1440" height="1365" fill="#ffffff"/>
  <defs>
    <marker id="openArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
    <marker id="hollowTriangle" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 13 7 L 0 14 Z" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
    </marker>
  </defs>
  <text x="720.0" y="34" font-size="17" font-weight="bold" text-anchor="middle">Laundry Tracker: accounts (sign up, login, session)</text>
<rect x="200" y="60" width="380" height="89" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="104" x2="580" y2="104" stroke="#333" stroke-width="1.5"/>
  <line x1="200" y1="116" x2="580" y2="116" stroke="#333" stroke-width="1.5"/>
  <text x="390.0" y="77" font-size="12" font-style="italic" text-anchor="middle">« Android »</text>
  <text x="390.0" y="95" font-size="15" font-weight="bold" text-anchor="middle">AppCompatActivity</text>
  <text x="210" y="136" font-size="11" fill="#555">(from the AndroidX AppCompat library)</text>
  <rect x="1030" y="60" width="290" height="89" fill="#f2f2f2" stroke="#333" stroke-width="1.5"/>
  <line x1="1030" y1="104" x2="1320" y2="104" stroke="#333" stroke-width="1.5"/>
  <line x1="1030" y1="116" x2="1320" y2="116" stroke="#333" stroke-width="1.5"/>
  <text x="1175.0" y="77" font-size="12" font-style="italic" text-anchor="middle">« Android »</text>
  <text x="1175.0" y="95" font-size="15" font-weight="bold" text-anchor="middle">Application</text>
  <text x="1040" y="136" font-size="11" fill="#555">(from the Android framework)</text>
  <rect x="30" y="215" width="300" height="147" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="245" x2="330" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="295" x2="330" y2="295" stroke="#333" stroke-width="1.5"/>
  <text x="180.0" y="235" font-size="15" font-weight="bold" text-anchor="middle">LoginActivity</text>
  <text x="40" y="265" font-size="12">- emailInput: EditText</text>
  <text x="40" y="282" font-size="12">- passwordInput: EditText</text>
  <text x="40" y="315" font-size="12">+ onCreate(savedInstanceState: Bundle?)</text>
  <text x="40" y="332" font-size="12">- logIn()</text>
  <text x="40" y="349" font-size="11" fill="#555">« after the splash if not logged in »</text>
  <rect x="420" y="215" width="340" height="181" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="245" x2="760" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="329" x2="760" y2="329" stroke="#333" stroke-width="1.5"/>
  <text x="590.0" y="235" font-size="15" font-weight="bold" text-anchor="middle">SignupActivity</text>
  <text x="430" y="265" font-size="12">- emailInput: EditText</text>
  <text x="430" y="282" font-size="12">- passwordInput: EditText</text>
  <text x="430" y="299" font-size="12">- confirmInput: EditText</text>
  <text x="430" y="316" font-size="12">- MIN_PASSWORD_LENGTH: Int = 6</text>
  <text x="430" y="349" font-size="12">+ onCreate(savedInstanceState: Bundle?)</text>
  <text x="430" y="366" font-size="12">- signUp()</text>
  <text x="430" y="383" font-size="12">- openHome()</text>
  <rect x="1050" y="215" width="250" height="92" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="1050" y1="245" x2="1300" y2="245" stroke="#333" stroke-width="1.5"/>
  <line x1="1050" y1="257" x2="1300" y2="257" stroke="#333" stroke-width="1.5"/>
  <text x="1175.0" y="235" font-size="15" font-weight="bold" text-anchor="middle">MainApp</text>
  <text x="1060" y="277" font-size="12">+ onCreate()</text>
  <text x="1060" y="294" font-size="11" fill="#555">« creates both JSON stores »</text>
  <rect x="30" y="511" width="400" height="178" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="555" x2="430" y2="555" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="605" x2="430" y2="605" stroke="#333" stroke-width="1.5"/>
  <text x="230.0" y="528" font-size="12" font-style="italic" text-anchor="middle">« object »</text>
  <text x="230.0" y="546" font-size="15" font-weight="bold" text-anchor="middle">Session</text>
  <text x="40" y="575" font-size="12">- PREFS_NAME: String = "session"</text>
  <text x="40" y="592" font-size="12">- KEY_EMAIL: String = "email"</text>
  <text x="40" y="625" font-size="12">+ login(context: Context, email: String)</text>
  <text x="40" y="642" font-size="12">+ logout(context: Context)</text>
  <text x="40" y="659" font-size="12">+ currentEmail(context: Context): String?</text>
  <text x="40" y="676" font-size="11" fill="#555">« saved in SharedPreferences »</text>
  <rect x="560" y="511" width="340" height="106" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="555" x2="900" y2="555" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="605" x2="900" y2="605" stroke="#333" stroke-width="1.5"/>
  <text x="730.0" y="528" font-size="12" font-style="italic" text-anchor="middle">« object »</text>
  <text x="730.0" y="546" font-size="15" font-weight="bold" text-anchor="middle">AppData</text>
  <text x="570" y="575" font-size="12">+ machines: MachineStore  (lateinit)</text>
  <text x="570" y="592" font-size="12">+ users: UserStore  (lateinit)</text>
  <rect x="30" y="799" width="400" height="157" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="843" x2="430" y2="843" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="855" x2="430" y2="855" stroke="#333" stroke-width="1.5"/>
  <text x="230.0" y="816" font-size="12" font-style="italic" text-anchor="middle">« object »</text>
  <text x="230.0" y="834" font-size="15" font-weight="bold" text-anchor="middle">Passwords</text>
  <text x="40" y="875" font-size="12">+ newSalt(): String</text>
  <text x="40" y="892" font-size="12">+ hash(password: String, salt: String): String</text>
  <text x="40" y="909" font-size="12">+ matches(password: String, user: UserModel): Boolean</text>
  <text x="40" y="926" font-size="12">- toHex(bytes: ByteArray): String</text>
  <text x="40" y="943" font-size="11" fill="#555">« SHA-256 of salt + password »</text>
  <rect x="560" y="799" width="340" height="123" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="843" x2="900" y2="843" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="855" x2="900" y2="855" stroke="#333" stroke-width="1.5"/>
  <text x="730.0" y="816" font-size="12" font-style="italic" text-anchor="middle">« interface »</text>
  <text x="730.0" y="834" font-size="15" font-weight="bold" text-anchor="middle">UserStore</text>
  <text x="570" y="875" font-size="12">+ findAll(): List&lt;UserModel&gt;</text>
  <text x="570" y="892" font-size="12">+ create(user: UserModel)</text>
  <text x="570" y="909" font-size="12">+ findByEmail(email: String): UserModel?</text>
  <rect x="1000" y="799" width="410" height="232" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="1000" y1="829" x2="1410" y2="829" stroke="#333" stroke-width="1.5"/>
  <line x1="1000" y1="930" x2="1410" y2="930" stroke="#333" stroke-width="1.5"/>
  <text x="1205.0" y="819" font-size="15" font-weight="bold" text-anchor="middle">UserJSONStore</text>
  <text x="1010" y="849" font-size="12">- file: File  (users.json)</text>
  <text x="1010" y="866" font-size="12">- gson: Gson</text>
  <text x="1010" y="883" font-size="12">- listType: Type</text>
  <text x="1010" y="900" font-size="12">- users: ArrayList&lt;UserModel&gt;</text>
  <text x="1010" y="917" font-size="12">- lastId: AtomicLong</text>
  <text x="1010" y="950" font-size="12">+ findAll(): List&lt;UserModel&gt;</text>
  <text x="1010" y="967" font-size="12">+ create(user: UserModel)</text>
  <text x="1010" y="984" font-size="12">+ findByEmail(email: String): UserModel?</text>
  <text x="1010" y="1001" font-size="12">- save()</text>
  <text x="1010" y="1018" font-size="12">- load()</text>
  <rect x="560" y="1121" width="340" height="164" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="1151" x2="900" y2="1151" stroke="#333" stroke-width="1.5"/>
  <line x1="560" y1="1235" x2="900" y2="1235" stroke="#333" stroke-width="1.5"/>
  <text x="730.0" y="1141" font-size="15" font-weight="bold" text-anchor="middle">UserModel</text>
  <text x="570" y="1171" font-size="12">+ id: Long = 0</text>
  <text x="570" y="1188" font-size="12">+ email: String</text>
  <text x="570" y="1205" font-size="12">+ passwordHash: String</text>
  <text x="570" y="1222" font-size="12">+ salt: String</text>
  <text x="570" y="1255" font-size="11" fill="#555">« data class »</text>
  <text x="570" y="1272" font-size="12">never stores the real password</text>
  <path d="M 180.0 215 L 180.0 179" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 590.0 215 L 590.0 179" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 180.0 179 L 590.0 179" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 390.0 179 L 390.0 149" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#hollowTriangle)"/>
  <text x="592" y="173" font-size="11" fill="#555" text-anchor="start">« extends »</text>
  <path d="M 1175.0 215 L 1175.0 149" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#hollowTriangle)"/>
  <text x="1183.0" y="186.0" font-size="11" fill="#555" text-anchor="start">« extends »</text>
  <path d="M 330 265 L 420 265" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="375.0" y="258" font-size="11" fill="#555" text-anchor="middle">« opens »</text>
  <path d="M 180.0 362 L 180.0 441" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 590.0 396 L 590.0 441" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 14 441 L 730.0 441" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <path d="M 230.0 441 L 230.0 511" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <path d="M 730.0 441 L 730.0 511" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <path d="M 14 441 L 14 824 L 30 824" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="738.0" y="433" font-size="11" fill="#555" text-anchor="start">« uses »</text>
  <path d="M 1090 307 L 1090 561 L 900 561" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="910" y="554" font-size="11" fill="#555" text-anchor="start">« sets users »</text>
  <path d="M 1260 307 L 1260 799" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="1254" y="789" font-size="11" fill="#555" text-anchor="end">« creates »</text>
  <path d="M 730.0 617 L 730.0 799" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#openArrow)"/>
  <text x="738.0" y="791" font-size="11" fill="#555" text-anchor="start">1</text>
  <text x="738.0" y="635" font-size="11" fill="#555" text-anchor="start">users</text>
  <path d="M 1000 859 L 900 859" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#hollowTriangle)"/>
  <text x="950.0" y="852" font-size="11" fill="#555" text-anchor="middle">« implements »</text>
  <path d="M 730.0 922 L 730.0 1121" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="738.0" y="942" font-size="11" fill="#555" text-anchor="start">« uses »</text>
  <polygon points="1205.0,1031 1212.0,1042 1205.0,1053 1198.0,1042" fill="#fff" stroke="#333" stroke-width="1.2"/>
  <path d="M 1205.0 1053 L 1205.0 1161 L 900 1161" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#openArrow)"/>
  <text x="908" y="1155" font-size="11" fill="#555" text-anchor="start">0..*</text>
  <text x="1215.0" y="1069" font-size="11" fill="#555" text-anchor="start">saves / loads with Gson</text>
  <path d="M 230.0 956 L 230.0 1161 L 560 1161" fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="238.0" y="976" font-size="11" fill="#555" text-anchor="start">« checks »</text>
  <text x="30" y="1337" font-size="11" fill="#555">Key:</text><text x="62" y="1337" font-size="11" fill="#555">+ public</text><text x="133" y="1337" font-size="11" fill="#555">- private</text><text x="210" y="1337" font-size="11" fill="#555">? can be null</text><text x="310" y="1337" font-size="11" fill="#555">hollow triangle = extends / implements</text><text x="552" y="1337" font-size="11" fill="#555">hollow diamond = holds 0..*</text><text x="731" y="1337" font-size="11" fill="#555">dashed arrow = uses / opens / creates</text>
</svg>
